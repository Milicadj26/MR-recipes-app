<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Favorites</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-segment [value]="sortBy()" class="fav-sort">
    <ion-segment-button value="recent" (click)="setSort('recent')">Recent</ion-segment-button>
    <ion-segment-button value="time" (click)="setSort('time')">Time</ion-segment-button>
    <ion-segment-button value="calories" (click)="setSort('calories')">kcal</ion-segment-button>
    <ion-segment-button value="difficulty" (click)="setSort('difficulty')">Difficulty</ion-segment-button>
  </ion-segment>

  @if (sorted().length === 0) {
    <p style="opacity:.6;margin-top:12px">No favorites yet. Tap the ♥ on a recipe to add it.</p>
  } @else {
    <div class="list">
      @for (r of sorted(); track r.id) {
        <app-recipe [item]="r"></app-recipe>
      }
    </div>
  }
</ion-content>
