<div class="container">
  <swiper-container
    slides-per-view="4"
    space-between="12"
    pagination="false"
    style="display:block;width:100%;height:110px"
  >
    @for (c of categories(); track c.id) {
      <swiper-slide>
        <button class="cat-card" type="button" (click)="open(c, $event)">
          <img [src]="c.image" [alt]="c.name" />
          <p class="small">{{ c.name }}</p>
        </button>
      </swiper-slide>
    }
  </swiper-container>
</div>
