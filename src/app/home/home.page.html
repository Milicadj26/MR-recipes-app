<ion-header>
  <ion-toolbar>
    <ion-title>Recipe Hub</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear">
        <ion-icon slot="icon-only" name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <h2 class-="big-text">What are we cooking today?</h2>
  <div class="search-row">
    <ion-searchbar
    [(ngModel)]="query"
    placeholder="Search"
    show-clear-button="focus"
    inputmode="search">
    </ion-searchbar>

    <ion-button 
      class="filter-button"
      fill="outline"
      (click)="toggleFilter()"
      [style.outline]="filterOn ? '2px solid red' : 'none'">
      <ion-icon name="options-outline"></ion-icon>
    </ion-button>
  </div>

 

  

  
</ion-content>
