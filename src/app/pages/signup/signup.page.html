<ion-content [fullscreen]="true">
  <div class="header">
    <ion-title class="title">Welcome!</ion-title>
    <p class="subtitle">Create your account</p>
  </div>

  <form #signUpForm="ngForm" novalidate>
    <div class="ion-padding">

      <!-- USERNAME -->
      <ion-item class="item">
        <ion-input
          class="input"
          placeholder="Username"
          name="name"
          ngModel
          required
          #name="ngModel">
        </ion-input>
        <ion-icon name="person-outline"></ion-icon>
      </ion-item>
      <ion-item class="input-box" lines="none" *ngIf="name.invalid && name.touched">
        <ion-label color="danger">Username is required.</ion-label>
      </ion-item>

      <!-- EMAIL -->
      <ion-item class="item">
        <ion-input
          class="input"
          placeholder="Email"
          type="email"
          name="email"
          ngModel
          required
          email
          autocomplete="email"
          #email="ngModel">
        </ion-input>
        <ion-icon name="person-outline"></ion-icon>
      </ion-item>
      <ion-item class="input-box" lines="none" *ngIf="email.invalid && email.touched">
        <ion-label color="danger">
          <span *ngIf="email.errors?.['required']">Email is required.</span>
          <span *ngIf="email.errors?.['email']">Enter a valid email.</span>
        </ion-label>
      </ion-item>

      <!-- PASSWORD  -->
      <ion-item class="item">
        <ion-input
          class="input"
          placeholder="Password"
          name="password"
          type="password"
          ngModel
          required
          minlength="7"
          maxlength="20"
          autocomplete="new-password"
          #password="ngModel">
        </ion-input>
        <ion-icon name="lock-closed-outline"></ion-icon>
      </ion-item>
      <ion-item class="input-box" lines="none" *ngIf="password.invalid && password.touched">
        <ion-label color="danger">
          <span *ngIf="password.errors?.['required']">Password is required.</span>
          <span *ngIf="password.errors?.['minlength']">At least 7 characters.</span>
        </ion-label>
      </ion-item>

      <!-- CONFIRM PASSWORD -->
      <ion-item class="item">
        <ion-input
          class="input"
          placeholder="Confirm password"
          type="password"
          name="confirm"
          ngModel
          required
          autocomplete="new-password"
          #confirm="ngModel">
        </ion-input>
        <ion-icon name="lock-closed-outline"></ion-icon>
      </ion-item>
      <ion-item lines="none" *ngIf="confirm.invalid && confirm.touched">
        <ion-label color="danger">Please confirm your password.</ion-label>
      </ion-item>

      <!-- AINT SAME PASSWORD -->
      <ion-item lines="none"
        *ngIf="password.value && confirm.value && password.value !== confirm.value">
        <ion-label color="danger">Passwords do not match.</ion-label>
      </ion-item>

      <!-- LINKS -->
      <div class="signuplink">
        <p>Already a member? <a [routerLink]="['/login']">Log in now</a></p>
      </div>

    </div>

    <!-- SUBMIT FAB -->
    <ion-fab class="button" slot="fixed" vertical="bottom" horizontal="end" style="margin: 0 20px 20px 0;">
      <ion-fab-button
        color="primary"
        [disabled]="signUpForm.invalid || (password.value !== confirm.value)"
        (click)="onSignup(signUpForm)">
        <ion-icon name="chevron-forward"></ion-icon>
      </ion-fab-button>
    </ion-fab>
  </form>
</ion-content>
